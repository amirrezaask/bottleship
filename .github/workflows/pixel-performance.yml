name: Pixel performance

on:
  push:
    branches: ['perf/wasm-pixel-*']
  pull_request:
    paths:
      - 'tools/build-dxt-kernel/**'
      - 'src/worker/modules/ddraw/gpu-texture-utils.ts'
      - 'src/worker/backends/webgpu/shared/**'
      - 'tools/perf/**'
      - 'tools/tests/**'
      - '.github/workflows/pixel-performance.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.85.0 --profile minimal --target wasm32-unknown-unknown
      - run: node tools/build-dxt-kernel/build.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: pixel-kernels
          path: src/worker/backends/webgpu/shared/dxt-kernel*.wasm
          retention-days: 14
