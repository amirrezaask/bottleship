name: Windows runtime evidence

on:
  push:
    branches: [perf/windows-runtime-20260918]
  pull_request:
    paths:
      - 'src/gamebox-bridge.js'
      - 'src/worker/core/memory/**'
      - 'src/worker/modules/d3dx9/**'
      - 'src/worker/api/d3dx9.api.ts'
      - 'tools/windows-runtime/**'
      - 'tools/reference/d3dx9/**'
      - '.github/workflows/windows-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hle-kernels:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: HLE conformance, allocation and host-event contracts (not guest execution)
        run: |
          mkdir -p evidence
          node --experimental-vm-modules --test tools/windows-runtime/conformance.mjs tools/windows-runtime/bridge.mjs | tee evidence/conformance.tap
      - name: Paired baseline versus candidate real-source HLE benchmarks
        run: node --experimental-vm-modules tools/windows-runtime/benchmark.mjs --assert-gain | tee evidence/benchmark.log
      - name: Publish raw measurements even when an assertion fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hle-evidence-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
  windows-samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install 32-bit Windows cross compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686 binutils-mingw-w64-i686
      - name: Compile original Direct3D 8, Direct3D 9 and DirectDraw 7 games
        run: bash tools/windows-runtime/samples/build.sh "$GITHUB_WORKSPACE/evidence/windows-samples"
      - name: Publish PE32 programs and import/byte identity receipts
        uses: actions/upload-artifact@v4
        with:
          name: windows-samples-${{ github.sha }}
          path: evidence/windows-samples/
          if-no-files-found: error
  full-runtime-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Preserve exact source receipt
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          git submodule status > evidence/submodules.txt
          git archive --format=tar HEAD | gzip > evidence/runtime-source.tar.gz
          node --version > evidence/node-version.txt
          lscpu > evidence/cpu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-source-${{ github.sha }}
          path: evidence/
          if-no-files-found: error
      - name: Require exact CPU source pin; never replace it with upstream HEAD
        run: git submodule update --init --recursive
      - name: Existing x86 runtime contracts
        run: node --test tools/runtime-test/*.test.mjs
