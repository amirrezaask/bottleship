name: REP code-generation experiment
on:
  push:
    branches: ['perf/wasm-rep-fastpaths-stacked']
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  isolated-helper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      V86_TEST_BINARY: performance-results/v86-noinline.wasm
      V86_REBUILT_BASELINE: performance-results/v86-pr4-rebuilt.wasm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - name: Isolate large intrinsics from caller code generation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/build-v86-runtime/rep-memory.rs')
          s=p.read_text().replace('pub unsafe fn compare<', '#[inline(never)]\npub unsafe fn compare<').replace('pub unsafe fn fill<', '#[inline(never)]\npub unsafe fn fill<')
          p.write_text(s)
          PY
      - name: Build experimental binary and exact parent control
        env:
          V86_OUTPUT: performance-results/v86-noinline.wasm
          V86_REP_BASELINE_OUTPUT: performance-results/v86-pr4-rebuilt.wasm
        run: node tools/build-v86-runtime/build.mjs
      - run: node --test tools/runtime-test/*.test.mjs > performance-results/cpu-tests.log 2>&1
      - name: Compare in Node and Chromium
        run: |
          node tools/perf/rep-memory.mjs fb04401f30b1267548b05cb2574ace7b9d47f4dc performance-results/node-rep.json
          node tools/perf/browser-rep-memory.mjs fb04401f30b1267548b05cb2574ace7b9d47f4dc performance-results/chromium-rep.json
      - name: Record exact experimental patch
        if: always()
        run: |
          mkdir -p performance-results
          git diff > performance-results/experiment.patch
          cp tools/build-v86-runtime/manifest.json performance-results/manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep-noinline-experiment
          path: performance-results/
          retention-days: 14
