name: REP performance
on:
  push:
    branches: ['perf/wasm-rep-fastpaths-stacked']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bootstrap:
    if: github.ref == 'refs/heads/perf/wasm-rep-fastpaths-stacked'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - name: Build integrated REP core and parent control
        env:
          V86_REP_BASELINE_OUTPUT: performance-results/v86-pr4-rebuilt.wasm
        run: node tools/build-v86-runtime/build.mjs
      - name: Publish generated assets on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v86.wasm tools/build-v86-runtime/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish integrated REP runtime and provenance'
            git push origin HEAD:perf/wasm-rep-fastpaths-stacked
          fi
          git bundle create performance-results/source.bundle --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rep-core-build
          path: performance-results/
          retention-days: 14
