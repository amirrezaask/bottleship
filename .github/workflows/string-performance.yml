name: String performance

on:
  push:
    branches: ['perf/wasm-string-fastpaths-stacked']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Preserve exact parent and sources
        run: |
          mkdir -p performance-results
          git bundle create performance-results/source.bundle --all
          git rev-parse HEAD > performance-results/head.txt
          git show dd9914a7f4cf90bb2bc833d34733d2d0ce0ec9e8:public/v86.wasm > performance-results/v86-pr3.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: string-baseline-source
          path: performance-results/
          retention-days: 14
