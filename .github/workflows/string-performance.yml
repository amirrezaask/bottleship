name: String performance

on:
  push:
    branches: ['perf/wasm-string-fastpaths-stacked']

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bootstrap:
    if: github.ref == 'refs/heads/perf/wasm-string-fastpaths-stacked'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Harden raw dispatch IDs on this branch only
        run: |
          git apply --check tools/build-v86-runtime/host-string.patch
          git apply tools/build-v86-runtime/host-string.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/core/cpu/hypercall-data.ts
          git commit -m 'fix: reject invalid raw dispatch IDs before mutating bindings'
          git push origin HEAD:refs/heads/perf/wasm-string-fastpaths-stacked
          mkdir -p performance-results
          git bundle create performance-results/source.bundle --all
      - uses: actions/upload-artifact@v4
        with:
          name: string-host-build
          path: performance-results/
          retention-days: 14
