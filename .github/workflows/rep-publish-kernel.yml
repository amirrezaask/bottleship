name: Publish verified REP core
on:
  push:
    branches: ['perf/wasm-rep-fastpaths-stacked']
permissions:
  contents: write
defaults:
  run:
    shell: bash
jobs:
  publish:
    if: github.ref == 'refs/heads/perf/wasm-rep-fastpaths-stacked'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - run: rustup toolchain install 1.90.0 --profile minimal --target wasm32-unknown-unknown
      - run: node tools/build-v86-runtime/build.mjs
      - name: Verify CPU and native instruction semantics before publishing
        run: |
          node --test tools/runtime-test/*.test.mjs
          gcc -O2 -Wall -Wextra -Werror tools/runtime-test/rep-native-oracle.c -o /tmp/rep-native-oracle
          node tools/perf/verify-rep-native.mjs /tmp/rep-native-oracle
      - name: Publish this branch's generated assets only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/v86.wasm tools/build-v86-runtime/manifest.json
          if ! git diff --cached --quiet; then
            git commit -m 'build: publish tuned REP core with isolated SIMD helpers'
            git push origin HEAD:perf/wasm-rep-fastpaths-stacked
          fi
